parameters:
  name: ''
  CIBW_BUILD: ''
  NUMPY_VERSION: ''
  vmImage: ''
  force: false
  pypitest: false

jobs:
  - job: 'Wheel_${{ parameters.name }}'
    condition: or( eq( '${{ parameters.force }}', 'true'), startsWith(variables['Build.SourceBranch'], 'refs/tags/'))
    pool:
      vmImage: ${{ parameters.vmImage }}
    variables:
      TWINE_TOKEN: $(PIPY_TOKEN)
      TWINE_TOKEN_TEST: $(PIPY_TEST_TOKEN)
      CIBW_BUILD: ${{ parameters.CIBW_BUILD }}
      NUMPY_VERSION: ${{ parameters.NUMPY_VERSION }}
      CIBW_SKIP: '*win32'
      CIBW_BUILD_VERBOSITY: '1'
      CIBW_TEST_COMMAND: python -m pip install scipy scikit-learn && python -c "import unittest;result=unittest.TextTestRunner(verbosity=2).run(unittest.defaultTestLoader.discover(r'{project}/test/python/'));exit(0 if result.wasSuccessful() else 1)"

    timeoutInMinutes: 60
    steps:

      - powershell: |
          & "$(Build.SourcesDirectory)\tools\build_tbb_windows.ps1"

          $TBB_INSTALL_PREFIX = "C:\tbb"
          $tbbDll = Get-ChildItem "$TBB_INSTALL_PREFIX\bin\tbb*.dll" |
            Where-Object { $_.Name -match '^tbb\d*\.dll$' } |
            Select-Object -First 1
          if (-not $tbbDll) {
            throw "Cannot find the oneTBB runtime DLL in $TBB_INSTALL_PREFIX\bin."
          }

          $tbbInstallUnixPath = $TBB_INSTALL_PREFIX.Replace('\', '/')
          $tbbDllUnixPath = $tbbDll.FullName.Replace('\', '/')
          $cibwEnvironment = "HG_USE_TBB=1 TBB_DLL=$tbbDllUnixPath TBB_DIR=$tbbInstallUnixPath/lib/cmake/TBB NUMPY_VERSION=${{ parameters.NUMPY_VERSION }}"
          Write-Host "##vso[task.setvariable variable=CIBW_ENVIRONMENT_WINDOWS]$cibwEnvironment"
          Write-Host "##vso[task.setvariable variable=TBB_LIB_DIR]$TBB_INSTALL_PREFIX\lib"
        displayName: Build oneTBB from source

      - task: UsePythonVersion@0
        inputs:
          versionSpec: '3.14'
          addToPath: true

      - script: |
          python --version
          python -m pip install cibuildwheel==3.3.1
        displayName: Install python packages

      - script: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALLPATH=%%i"
          if not defined VSINSTALLPATH exit /b 1
          call "%VSINSTALLPATH%\Common7\Tools\VsDevCmd.bat" -arch=amd64
          set "LIB=%TBB_LIB_DIR%;%LIB%"
          where dumpbin
          where lib
          cibuildwheel --output-dir wheelhouse
        displayName: Build
        workingDirectory: $(Build.SourcesDirectory)

      - script: |
          python -m pip install twine
          python -m twine upload -u __token__ -p $(TWINE_TOKEN) wheelhouse/*.whl
        displayName: Upload wheel
        workingDirectory: $(Build.SourcesDirectory)
        condition: startsWith(variables['Build.SourceBranch'], 'refs/tags/')

      - script: |
          python -m pip install twine
          python -m twine upload -r testpypi -u __token__ -p $(TWINE_TOKEN_TEST) wheelhouse/*.whl
        displayName: Test upload wheel
        workingDirectory: $(Build.SourcesDirectory)
        condition: eq('${{ parameters.pypitest }}', 'true')