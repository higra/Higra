jobs:
  - job: 'Linux_gcc'
    strategy:
      matrix:
        gcc_11_regression:
          c_compiler: 'gcc-11'
          cxx_compiler: 'g++-11'
          compiler_packages: 'gcc-11 g++-11'
          HG_USE_TBB: 'Off'
        gcc_14:
          c_compiler: 'gcc-14'
          cxx_compiler: 'g++-14'
          compiler_packages: 'gcc-14 g++-14'
          HG_USE_TBB: 'Off'
        gcc_14_tbb:
          c_compiler: 'gcc-14'
          cxx_compiler: 'g++-14'
          compiler_packages: 'gcc-14 g++-14'
          HG_USE_TBB: 'On'
        clang_18:
          c_compiler: 'clang-18'
          cxx_compiler: 'clang++-18'
          compiler_packages: 'clang-18'
          HG_USE_TBB: 'Off'
        clang_18_tbb:
          c_compiler: 'clang-18'
          cxx_compiler: 'clang++-18'
          compiler_packages: 'clang-18'
          HG_USE_TBB: 'On'
        gcc_14_oldest_numpy:
          c_compiler: 'gcc-14'
          cxx_compiler: 'g++-14'
          compiler_packages: 'gcc-14 g++-14'
          HG_USE_TBB: 'Off'
          OLDEST_NUMPY: 1
        gcc_14_coverage:
          c_compiler: 'gcc-14'
          cxx_compiler: 'g++-14'
          compiler_packages: 'gcc-14 g++-14'
          HG_USE_TBB: 'On'
          COVERAGE: 1
    pool:
      vmImage: ubuntu-24.04
    variables:
      CODECOV_TOKEN: $(CODECOV_TOKEN_scr)
      CC: $(c_compiler)
      CXX: $(cxx_compiler)
    timeoutInMinutes: 360
    steps:

      - script: |
          set -e
          sudo apt-get update
          sudo apt-get --no-install-suggests --no-install-recommends install $(compiler_packages)
          $(c_compiler) --version
          $(cxx_compiler) --version
          if [[ -n "$COVERAGE" ]]; then
            sudo apt-get --no-install-suggests --no-install-recommends install lcov
          fi
        displayName: Install build toolchain

      - bash: echo "##vso[task.prependpath]$CONDA/bin"
        displayName: Add conda to PATH

      - script: |
          set -e
          conda config --set always_yes yes --set changeps1 no
          conda update -q conda
          if [[ -n "$OLDEST_NUMPY" ]]; then
            # oldest supported Python and NumPy versions (see install_requires in setup.py)
            conda create -q -n oldest --override-channels -c conda-forge python=3.10 numpy=2.0.0 scipy=1.14.0 scikit-learn=1.5.1
            echo "##vso[task.setvariable variable=HG_PYTHON]$CONDA/envs/oldest/bin/python"
          else
            conda install scikit-learn -c conda-forge
            echo "##vso[task.setvariable variable=HG_PYTHON]$CONDA/bin/python"
          fi
        displayName: Install python packages

      - script: |
          bash $(Build.SourcesDirectory)/tools/cibuildwheel_osx.sh
        displayName: Build oneTBB from source

      - script: |
          set -e
          unset CFLAGS CXXFLAGS CPPFLAGS
          printf '#include "higra/hierarchy/component_tree_casf.hpp"\n' | "$CXX" -std=c++17 -I"$(Build.SourcesDirectory)/include" -I"$(Build.SourcesDirectory)/lib/include" -x c++ -fsyntax-only -
          "$HG_PYTHON" -c "import sys, numpy; print('Python', sys.version, 'NumPy', numpy.__version__)"
          mkdir build
          cd build
          CMAKE_EXTRA_ARGS="$CMAKE_EXTRA_ARGS -DPython_EXECUTABLE=$HG_PYTHON -DTBB_DIR=$HOME/tbb/lib/cmake/TBB -DHG_USE_TBB=$HG_USE_TBB -DHG_UNITY_BUILD=ON -DHG_UNITY_BUILD_BATCH_SIZE=4";          MAKE_TARGETS="test_exe"
          if [[ -n "$COVERAGE" ]]; then
            CMAKE_EXTRA_ARGS="$CMAKE_EXTRA_ARGS -DCMAKE_BUILD_TYPE=Coverage"
          else
            MAKE_TARGETS="$MAKE_TARGETS higram test_python_exe"
            CMAKE_EXTRA_ARGS="$CMAKE_EXTRA_ARGS -DCMAKE_BUILD_TYPE=Debug -DDO_EMBEDDED_PYTHON_CPP_TEST=ON"
          fi
          cmake $CMAKE_EXTRA_ARGS $(Build.SourcesDirectory)
          make -j2 $MAKE_TARGETS
        displayName: Build
        workingDirectory: $(Build.BinariesDirectory)

      - script: |
          set -e
          if [ -n "$COVERAGE" ]; then
            ctest -R Test_cpp
            lcov --directory . --capture --gcov-tool gcov-14 --rc geninfo_unexecuted_blocks=1 --ignore-errors mismatch --output-file coverage.info && # capture coverage info
            lcov --remove coverage.info '*lib/include*' --output-file coverage.info && # filter out system
            lcov --remove coverage.info '/usr*' --output-file coverage.info && # filter out system
            lcov --remove coverage.info '*_deps/*' --output-file coverage.info && # filter out system
            lcov --list coverage.info #debug info
          else
            ctest -V
          fi
        displayName: Test
        workingDirectory: $(Build.BinariesDirectory)/build

      - script: |
          set -e

          curl -Os https://uploader.codecov.io/latest/linux/codecov
          chmod +x codecov
          ./codecov -v -s $(Build.BinariesDirectory)/build

        displayName: Upload coverage
        workingDirectory: $(Build.SourcesDirectory)
        condition: eq( variables['COVERAGE'], '1' )
